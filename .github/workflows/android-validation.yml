name: Android validation

on:
  push:
    branches:
      - play-store-release
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug bundle
        run: gradle -p android bundleDebug

      - name: Upload debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: mapa-territorial-jde33-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
